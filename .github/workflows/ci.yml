name: NestJS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AI_Engineering_Challenges

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: AI_Engineering_Challenges/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Type check (TypeScript compiler)
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Run unit & integration tests
        run: npm run test
